services:
  # ---------------------------------------------------------------------------
  # Backend REST API + Full-stack Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: canteen-preorder-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_FEE_PERCENT
        value: "0"
      - key: CORS_ORIGIN
        value: "*"

  # ---------------------------------------------------------------------------
  # Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: canteen-preorder-frontend
    plan: free
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://canteen-preorder-api.onrender.com
